<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RUBBERMATS.CH — Redirecting…</title>
  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || 'fr').substring(0, 2).toLowerCase();
      var supported = ['fr', 'de', 'en'];
      var stored = localStorage.getItem('rm_lang');
      var target = stored || (supported.indexOf(lang) !== -1 ? lang : 'fr');
      window.location.replace('/' + target + '/');
    })();
  </script>
</head>
<body></body>
</html>
